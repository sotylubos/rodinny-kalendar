<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Šotendář</title>
<meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Šotendář">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F6F3EE; --card:#FFFFFF; --card2:#FBF9F6; --ink:#1E2230; --muted:#737887; --line:#E8E3DB;
  --accent:#D9653B; --accent-ink:#fff; --accent-soft:#F8E3D9; --danger:#C8423A; --shadow:0 1px 2px rgba(30,34,48,.05),0 6px 20px rgba(30,34,48,.06);
  --radius:18px; --fam:#7C5CD6; --fam-soft:rgba(124,92,214,.14);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171C; --card:#1F222A; --card2:#252932; --ink:#EEF0F4; --muted:#9AA0AE; --line:#2E323C;
    --accent:#F07A4F; --accent-soft:#3A2820; --fam:#A48DF2; --fam-soft:rgba(164,141,242,.18); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
.hidden{display:none!important}
.serif{font-family:Fraunces,Georgia,serif}

/* ---------- screens ---------- */
.center{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));text-align:center;gap:18px}
.logo{width:88px;height:88px;border-radius:24px;box-shadow:var(--shadow)}
.center h1{font-family:Fraunces,serif;font-weight:650;font-size:32px;margin:6px 0 0;letter-spacing:-.5px}
.center p{color:var(--muted);margin:0;max-width:320px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px;border-radius:16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.wide{width:100%;max-width:340px}
.btn.danger{background:transparent;color:var(--danger)}
.claim-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px}
.claim-grid button{background:var(--card);border-radius:18px;padding:18px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700}

/* ---------- app shell ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{font-family:Fraunces,serif;font-weight:650;font-size:28px;margin:0;letter-spacing:-.4px;flex:1;text-transform:capitalize}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.icon-btn svg{width:21px;height:21px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-top:12px}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{min-width:0;height:34px;padding:0 4px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{background:var(--ink);color:var(--bg)}

/* week strip */
.week{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;align-items:center;gap:2px;margin-top:10px}
.week .nav{height:56px;display:grid;place-items:center;color:var(--muted)}
.wd{height:60px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.wd small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.wd b{font-size:18px;font-weight:800}
.wd .dots{display:flex;gap:2px;height:5px}
.wd .dots i{width:5px;height:5px;border-radius:50%}
.wd.today b{color:var(--accent)}
.wd.sel{background:var(--ink)} .wd.sel small,.wd.sel b{color:var(--bg)}
.day-h .nd{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.day-h .nd::before{content:'svátek · ';opacity:.7}
.hol{margin:-4px 4px 8px;font-size:13px;font-weight:700;color:var(--danger)}
.ev .title .ic{margin-right:6px}
.tag.inv{background:#FFF1BF;color:#7A5C00}
@media (prefers-color-scheme: dark){ .tag.inv{background:#3A3215;color:#F5D46B} }
.hlp{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.hlp-i{font-size:22px;width:30px;flex:none;text-align:center}
.hlp b{font-size:15px}
.hlp p{margin:3px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.idea{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);line-height:1.4}
.idea .itx{white-space:pre-wrap}
.idea small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-bottom:3px}
.cms{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.cm{font-size:14px;padding:4px 0;white-space:pre-wrap}
.cm small{display:inline;margin-left:6px;font-size:11px}
.cm-new{display:flex;gap:6px;margin-top:8px}
.cm-new .inp{height:40px;font-size:15px}
.cm-send{width:40px;height:40px;flex:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px}
.dst{margin:-4px 4px 8px;font-size:13px;font-weight:700;color:#0E8A96}
.age{color:var(--muted);font-weight:700}
.ndhit{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px;width:100%;text-align:left}
.ndhit .ndi{font-size:22px}
.ndhit b{font-size:16px;font-weight:800}
.ndhit small{display:block;color:var(--muted);font-weight:600;font-size:13px;margin-top:2px}
.tick.hol b,.tick.hol small{color:var(--danger)}
.mc.hol{color:var(--danger)}

main{padding:4px 16px calc(230px + env(safe-area-inset-bottom))}
.day{margin-top:18px}
.day-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 8px}
.day-h h2{font-family:Fraunces,serif;font-weight:650;font-size:20px;margin:0;letter-spacing:-.2px}
.day-h span{color:var(--muted);font-size:14px;font-weight:600}
.day-h.today h2{color:var(--accent)}
.ev{display:flex;gap:12px;align-items:stretch;background:var(--card);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);margin-bottom:8px;width:100%;text-align:left}
.ev .bar{width:4px;border-radius:4px;flex:none}
.ev .time{width:50px;flex:none;font-weight:800;font-size:15px;line-height:1.25}
.ev .time small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.ev .body{flex:1;min-width:0}
.ev .title{font-weight:700;font-size:16px;line-height:1.3;word-wrap:break-word}
.ev .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;color:var(--muted);font-size:13px;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:48px 20px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.more{display:block;margin:20px auto 0;color:var(--muted);font-weight:700;font-size:14px;padding:10px 16px}

/* month */
.month-h{display:flex;align-items:center;justify-content:space-between;margin:10px 4px 10px}
.month-h h2{font-family:Fraunces,serif;font-weight:650;font-size:22px;margin:0;text-transform:capitalize}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--card);border-radius:var(--radius);padding:6px;box-shadow:var(--shadow)}
.mgrid .dn{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:2px 0 6px;text-transform:uppercase}
.mc{height:38px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:14px}
.mc.out{color:var(--muted);opacity:.45}
.mc.today{color:var(--accent)}
.mc.sel{background:var(--ink);color:var(--bg)}
.mc .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:30px}
.mc .dots i{width:4px;height:4px;border-radius:50%}
.mc .dots{height:4px}
.mgrid .dn{padding:2px 0 2px!important;font-size:10px!important}
.month-h{margin:6px 4px 6px!important}
.month-h h2{font-size:18px!important}
.month-h .icon-btn{width:36px;height:36px;border-radius:12px}
.top h1 .yr{font-family:Manrope,system-ui,sans-serif;font-size:17px;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:2px}
.free{margin:0 4px 6px;padding:10px 14px;border-radius:14px;border:1.5px dashed var(--line);color:var(--muted);font-weight:600;font-size:14px}

/* floating buttons */
.fabs{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:12px;z-index:6}
.fab{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(217,101,59,.35)}
.fab.main{background:var(--accent);color:#fff}
.fab.mic{background:var(--ink);color:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.fab svg{width:26px;height:26px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.42);z-index:20;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:26px 26px 0 0;max-height:92dvh;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:Fraunces,serif;font-weight:650;font-size:24px;margin:4px 0 14px;letter-spacing:-.3px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 2px 6px}
.inp{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;outline:none;font-size:16px}
textarea.inp{height:84px;padding:12px 14px;resize:none}
.inp:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;border:1.5px solid var(--line);height:50px;padding:0 14px;margin-bottom:14px;font-weight:600}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)} .sw.on::after{left:21px}
.who{display:flex;gap:8px;flex-wrap:wrap}
.who button{height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.who button .dot{width:10px;height:10px;border-radius:50%}
.who button.on{border-color:transparent;color:#fff}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}
.detail-title{font-family:Fraunces,serif;font-weight:650;font-size:26px;margin:4px 0 8px;line-height:1.2}
.detail-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600}
.detail-row svg{width:20px;height:20px;color:var(--muted);flex:none}
.note{white-space:pre-wrap;color:var(--ink);line-height:1.5}

/* voice */
.listen{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 14px}
.orb{width:84px;height:84px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;position:relative}
.orb svg{width:34px;height:34px}
.orb.on::before,.orb.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--accent);opacity:.5;animation:pulse 1.4s infinite}
.orb.on::after{animation-delay:.7s}
@keyframes pulse{from{transform:scale(.85);opacity:.6}to{transform:scale(1.35);opacity:0}}
.listen p{margin:0;color:var(--muted);font-weight:600;text-align:center}
.preview{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin:4px 0 14px}
.preview .pt{font-weight:800;font-size:17px}
.preview .pm{color:var(--muted);font-weight:600;font-size:14px;margin-top:4px}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:-4px 2px 14px}

/* search */
.search-top{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.search-top .inp{flex:1}
.res-date{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:3px}

/* settings */
.mem{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px}
.mem .r{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.mem .inp{height:44px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(200px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none;max-width:680px;margin:0 auto}
.dock-row{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:0 16px 12px}
.dock-row>*{pointer-events:auto}
.dock .fab{width:56px;height:56px;border-radius:19px}
.today-btn{height:44px;padding:0 18px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:15px;color:var(--accent);opacity:0;transform:translateY(10px) scale(.85);transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.3,1.3);pointer-events:none!important}
.today-btn.show{opacity:1;transform:none;pointer-events:auto!important}
.dial{pointer-events:auto;position:relative;height:calc(108px + env(safe-area-inset-bottom));overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:30px 30px 0 0;box-shadow:0 -8px 28px rgba(30,34,48,.10);cursor:grab}
.dial:active{cursor:grabbing}
.dial-rail{position:absolute;left:50%;border-radius:50%;border:1.5px dashed var(--line);pointer-events:none}
.dial-mark{position:absolute;left:50%;top:7px;width:22px;height:4px;margin-left:-11px;border-radius:4px;background:var(--accent)}
#dial-ticks{position:absolute;left:50%;width:0;height:0}
.tick{position:absolute;width:46px;height:60px;margin:-30px 0 0 -23px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:17px;will-change:transform}
.tick small{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;line-height:1.2}
.tick b{font-size:18px;font-weight:800;line-height:1.1}
.tick.we b{color:var(--muted)}
.tick.today b,.tick.today small{color:var(--accent)}
.tick.on{background:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.tick.on small,.tick.on b{color:var(--bg)}
.tick.on.today{background:var(--accent)} .tick.on.today small,.tick.on.today b{color:#fff}
.tick .dots{display:flex;gap:2px;height:5px}
.tick .dots i{width:5px;height:5px;border-radius:50%}
.chip.clear{padding:0 10px;color:var(--muted)}
@media (min-width:700px){ main,.top,.search-top{max-width:680px;margin-left:auto;margin-right:auto} }
</style>
</head>
<body>

<!-- Loading -->
<div id="scr-loading" class="center"><img class="logo" src="icon.svg" alt=""></div>

<!-- Login -->
<div id="scr-login" class="center hidden">
  <img class="logo" src="icon.svg" alt="">
  <h1>Šotendář</h1>
  <p>Rodinný kalendář Šotků. Zubař, práce, kroužky i dovolená — všechno na jednom místě.</p>
  <button class="btn wide" id="btn-google" style="margin-top:10px">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
    Přihlásit se přes Google
  </button>
</div>

<!-- Claim -->
<div id="scr-claim" class="center hidden">
  <h1>Kdo jste?</h1>
  <p>Jste první, kdo se přihlásil. Vyberte si svůj profil — ostatním pak v nastavení přidáte jejich e-maily.</p>
  <div class="claim-grid" id="claim-grid"></div>
</div>

<!-- No access -->
<div id="scr-noaccess" class="center hidden">
  <h1>Ještě nemáte přístup</h1>
  <p id="noaccess-text"></p>
  <button class="btn ghost wide" id="btn-retry">Zkusit znovu</button>
  <button class="btn danger" id="btn-logout2">Odhlásit se</button>
</div>

<!-- App -->
<div id="scr-app" class="hidden">
  <div class="top">
    <div class="top-row">
      <h1 id="hdr-title">Kalendář</h1>
      <button class="icon-btn" id="btn-search" aria-label="Hledat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>

  const s = evStartKey(e), span = Math.round((parseKey(evEndKey(e)) - parseKey(s))/864e5);
  if (!e.rrule) return (s <= to && addDays(s, span) >= from) ? [s] : [];
  const lim = e.rrule_until && e.rrule_until < to ? e.rrule_until : to, lo = addDays(from, -span), ex = e.exdates || [], out = [];
  const d0 = parseKey(s), sd = d0.getDate(); let k = s, n = 0, g = 0;
  const step = { daily:1, workdays:1, weekly:7, biweekly:14 }[e.rrule];
  if (step && s < lo){ k = addDays(s, Math.floor(Math.round((parseKey(lo) - d0)/864e5)/step)*step); }

function easter(y){ if (EASTER[y]) return EASTER[y]; const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),hh=(19*a+b-d-g+15)%30,i=Math.floor(c/4),kk=c%4,l=(32+2*e+2*i-hh-kk)%7,m=Math.floor((a+11*hh+22*l)/451),mo=Math.floor((hh+l-7*m+114)/31),da=((hh+l-7*m+114)%31)+1; const es = keyOf(new Date(y, mo-1, da)); return EASTER[y] = { fri: addDays(es,-2), mon: addDays(es,1) }; }
function holiday(k){ const f = HOL[k.slice(5,7)+k.slice(8,10)]; if (f) return f; const e = easter(+k.slice(0,4)); return k===e.fri ? 'Velký pátek' : k===e.mon ? 'Velikonoční pondělí' : ''; }
function lastSunday(y, m){ const d = new Date(y, m + 1, 0); d.setDate(d.getDate() - d.getDay()); return keyOf(d); }
function dstChange(k){ const y = +k.slice(0,4); return k === lastSunday(y, 2) ? '🕐 Změna na letní čas · ve 2:00 se posouvá na 3:00 (spíme o hodinu méně)' : k === lastSunday(y, 9) ? '🕐 Změna na zimní čas · ve 3:00 se posouvá na 2:00 (spíme o hodinu déle)' : ''; }
function dayExtra(k){ const n = nameDay(k), hl = holiday(k), dc = dstChange(k); return (n ? `<span class="nd">${esc(n)}</span>` : '') + '</div>' + (hl ? `<div class="hol">${esc(hl)} · státní svátek</div>` : '') + (dc ? `<div class="dst">${dc}</div>` : ''); }
const ICONS = [['zub','🦷'],['doktor|lekar|ordinac|nemocnic|ockovan|prohlidk|vysetren','🩺'],['narozenin','🎂'],['svatek|jmenin','🌸'],['vyroci|svatb','💍'],['oslav|party|vecirek','🎉'],['box','🥊'],['fotbal','⚽'],['hokej','🏒'],['tenis','🎾'],['plavan|bazen','🏊'],['kolo|cyklo','🚴'],['trenink|posilovn|fitness|beh|sport|zapas','🏋️'],['motork|moto','🏍️'],['skol|tridni|rodicovsk|pisemk|test|zkousk|maturit','🏫'],['prace|smena|sluzb|porad|meeting|schuzk','💼'],['dovolen|vylet|chalup|chat','🏖️'],['letadl|letiste|odlet|prilet','✈️'],['vlak|nadrazi','🚆'],['kadern|holic|strih','💇'],['kosmetik|manikur|pedikur','💅'],['auto|servis|stk|pneu|myt','🚗'],['nakup|obchod','🛒'],['vecere|obed|snidan|restaurac|kavarn|pizza','🍽️'],['kino|kina|film','🎬'],['divadl|koncert|muzikal|opera','🎭'],['urad|banka|posta|notar','🏛️'],['plat|zaplatit|faktur|najem|splatk','💳'],['veterin|pes|psa|kocka','🐾'],['uklid|prani|zehleni','🧹'],['zahrad|seka','🌱'],['babick|dedeck|navstev','👵']];
const ICON_RE = ICONS.map(([p,i]) => [new RegExp(p), i]);

function weekStart(k){ const d=parseKey(k); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return keyOf(d); }
function dotsFor(k, max){
  const ev = eventsOn(k); const cols = [];
  ev.forEach(e=>{ const ms = idsOf(e).map(memberOf).filter(Boolean); (ms.length ? ms.map(m=>m.color) : ['var(--fam)']).forEach(c=>{ if(!cols.includes(c)) cols.push(c); }); });

}
function renderWeek(){
  const ws = weekStart(selDay), t = todayKey(); let h = `<button class="nav" data-w="-7">‹</button>`;

const REPTXT = { daily:'každý den', workdays:'každý pracovní den', weekly:'každý týden', biweekly:'každý druhý týden', monthly:'každý měsíc', yearly:'každý rok' };
const CARDS = {};
function evCard(e, withDate, repKind){ CARDS[e.id] = e;
  const m = memberOf(e.member_id); const s = new Date(e.starts_at); const en = e.ends_at ? new Date(e.ends_at) : null;

  const rep = repKind ? `<span class="tag" style="background:var(--line);color:var(--muted)">↻ Opakuje se · ${REPTXT[repKind]||'pravidelně'}</span>` : master(e).rrule ? `<span title="Opakuje se">↻</span>` : '';

function renderList(){

/* ================= Czech voice/text parser ================= */
const MONTHS = ['ledna','unora','brezna','dubna','kvetna','cervna','cervence','srpna','zari','rijna','listopadu','prosince'];
const WDAYS = [['nedel'],['pondel'],['uter'],['stred'],['ctvrt'],['pat'],['sobot']];
const TITLE_MAP = [
  [/\b(k |ke )?zubar(i|e|em)?\b|\bzubak\b/, 'Zubař'],
  [/\b(k |ke )?(doktor(ovi|a|em)?|lekar(i|e|em)?)\b/, 'Lékař'],
  [/\b(do |v |na )?(prace|praci)\b/, 'Práce'],
  [/\b(ranni|odpoledni|nocni) smen[auye]?\b/, null],
  [/\bsmen[auye]\b/, 'Směna'],
  [/\b(na )?trenink\b/, 'Trénink'],
  [/\b(na )?box\b/, 'Box'],
  [/\b(na )?dovolen[aou]\b/, 'Dovolená'],

function parseCz(text){

  const today = new Date(); today.setHours(0,0,0,0);
  let date = null, start = null, end = null, allDay = false, member;

  // all day
  let m = /\b(cely den|celodenne|na cely den)\b/.exec(n); if (m){ allDay = true; take(m); }
  // explicit date: 3. 11. (2026)

  if (m){ const y = m[4] ? +m[4] : today.getFullYear(); let d = new Date(y, +m[2]-1, +m[1]); if (!m[4] && d < today) d.setFullYear(y+1); date = d; take(m); }
  // 3. listopadu
  if (!date){ m = new RegExp('\\b(\\d{1,2})\\.?\\s+('+MONTHS.join('|')+')(\\s+(\\d{4}))?\\b').exec(n);

    if (m){ const off = {dnes:0,dneska:0,zitra:1,pozitri:2}[m[1]]; date = new Date(today); date.setDate(date.getDate()+off); take(m); } }
  if (!date){ m = /\bza\s+(\d+|jeden|dva|tri|ctyri|pet)?\s*(den|dny|dni|tyden|tydny|tydnu|mesic)\b/.exec(n);
    if (m){ const w = {jeden:1,dva:2,tri:3,ctyri:4,pet:5}; const q = m[1] ? (w[m[1]]||+m[1]) : 1; date = new Date(today);
      if (m[2].startsWith('t')) date.setDate(date.getDate()+7*q); else if (m[2]==='mesic') date.setMonth(date.getMonth()+q); else date.setDate(date.getDate()+q); take(m); } }

  if (!start){ m = /\b(?:v|ve|o|od|na|kolem)?\s*(\d{1,2})[:.](\d{2})\b/.exec(n); if (m && +m[1]<24){ start=[+m[1],+m[2]]; take(m); } }
  if (!start){ m = /\b(?:v|ve|od|kolem)\s+(\d{1,2})(?:\s*hod\w*)?\b/.exec(n); if (m && +m[1]<24){ start=[+m[1],0]; take(m); } }
  if (!start){ m = /\b(\d{1,2})\s*hod\w*\b/.exec(n); if (m && +m[1]<24){ start=[+m[1],0]; take(m); } }
  if (!start){ m = /\b(?:v|ve|o)\s+pul\s+(\w+)\b/.exec(n); const W={jedne:1,druhe:2,treti:3,ctvrte:4,pate:5,seste:6,sedme:7,osme:8,devate:9,desate:10,jedenacte:11,dvanacte:12};

  if (m){ if (start && (m[1]==='odpoledne'||m[1]==='vecer') && start[0]<12){ start[0]+=12; if(end && end[0]<12) end[0]+=12; }
          if (!start){ start = {rano:[8,0],dopoledne:[10,0],odpoledne:[14,0],vecer:[18,0],'v noci':[22,0],'v poledne':[12,0]}[m[1]]; } take(m); }
  // people say "v 3" meaning 15:00
  if (start && !m && start[0]>=1 && start[0]<=5 && (!end || end[0]<=7) && !/\d[:.]\d/.test(src)) { start[0]+=12; if (end) end[0]+=12; }

  let inv = false; m = /(kdo se prida|kdo pujde|kdo jde)[ ?]*/.exec(n); if (m){ inv = true; take(m); }
  // member

  if (m){ member = null; take(m); }
  else {
    for (const mb of members){
      let st = norm(mb.name).trim(); if (!st) continue; if (st.length > 3) st = st.slice(0,-1);
      const re = new RegExp('\\b'+st.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*\\b','g'); let r;

  }

  // title
  let title = '';
  for (const [re, t] of TITLE_MAP){ const r = re.exec(n); if (r && t){ title = t; } }
  let rest = src.split('');
  cut.forEach(([a,b])=>{ for (let i=a;i<b;i++) rest[i]=' '; });
  rest = rest.join('');
  rest = rest.replace(/\s+/g,' ').trim();
  const FILL = /^(?:(?:pridej|pridat|zapis|zapiste|zapsat|napis|ma|mam|mame|maji|bude|budu|budeme|jde|jdu|jdeme|pujde|pujdu|je|a|tak|prosim|udalost|v|ve|na|od|do|o|k|ke)\s+)+/;

  else if (rest && norm(rest).replace(/\s/g,'').length > 0 && !TITLE_MAP.some(([re])=>re.test(norm(rest)))) title = title + ' – ' + rest;

  const out = { title };
  if (date) out.date = keyOf(date);
  if (member !== undefined) out.member_id = member;

  if (inv) out.invite = true;
  if (start){ out.start = pad(start[0])+':'+pad(start[1]);
    out.end = end ? pad(end[0])+':'+pad(end[1]) : pad((start[0]+1)%24)+':'+pad(start[1]); }
  return out;
}

}
function ndSearch(q){
  if (q.length < 2) return [];
  const t = todayKey(), y = +t.slice(0,4), out = [];
  for (const [md, names] of Object.entries(ND)) for (const n of names.split(', ')){
    if (!norm(n).startsWith(q)) continue;
    let yy = y, k; do { k = yy + '-' + md.slice(0,2) + '-' + md.slice(2); yy++; } while (k < t || parseKey(k).getMonth()+1 !== +md.slice(0,2));
    out.push({ n, k, d: dIdx(k) });
  }
  return out.sort((a,b) => a.d - b.d).slice(0, 8);
}

/* ================= notifications ================= */
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function isStandalone(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function b64ToBytes(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); s += '='.repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function currentSub(){ try { const r = await navigator.serviceWorker.ready; return await r.pushManager.getSubscription(); } catch(e){ return null; } }
async function initPushToggle(s){
  const sw = s.querySelector('#s-push'), hint = s.querySelector('#s-push-hint');
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (!pushSupported()){
    sw.disabled = true; sw.style.opacity = .4;
    hint.textContent = isIOS && !isStandalone() ? 'Na iPhonu fungují upozornění jen v aplikaci přidané na plochu (Sdílet → Přidat na plochu).' : 'Tento prohlížeč upozornění nepodporuje.';
    return;
  }
  let on = !!(await currentSub()) && Notification.permission === 'granted';
  sw.classList.toggle('on', on);
  if (Notification.permission === 'denied') hint.textContent = 'Upozornění jsou v telefonu zakázaná. Povolte je v nastavení telefonu u této aplikace.';
  sw.onclick = async () => {
    sw.disabled = true;
    try {
      if (!on){
        const perm = await Notification.requestPermission();
        if (perm !== 'granted'){ hint.textContent = 'Bez povolení upozornění posílat nejde.'; return; }
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
        const j = sub.toJSON();
        const { error } = await sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, member_id: me.id });
        if (error) throw error;
        on = true; hint.textContent = 'Hotovo — upozornění přijdou v 7:00 a v 19:00, když bude něco v kalendáři.';
      } else {
        const sub = await currentSub();
        if (sub){ await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
        on = false; hint.textContent = 'Upozornění vypnuta.';
      }
      sw.classList.toggle('on', on);
    } catch(e){ hint.textContent = 'Nepodařilo se to nastavit, zkuste to znovu.'; }
    finally { sw.disabled = false; }
  };
}

/* ================= thumb dial ================= */
const dial = { pos: 0, R: 520, STEP: 4.6, drag: null, anim: 0, last: null, quiet: false };
const MONS = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
const WDS = ['ne','po','út','st','čt','pá','so'];
function dIdx(k){ return Math.round((parseKey(k) - parseKey(todayKey()))/864e5); }
function dKey(i){ return addDays(todayKey(), i); }
function dialDraw(){
  const el = $('#dial-ticks'); if (!el) return;
  const c = Math.round(dial.pos); let h = '';
  for (let i = c - 10; i <= c + 10; i++){
    const a = (i - dial.pos) * dial.STEP; if (Math.abs(a) > 42) continue;
    const k = dKey(i), d = parseKey(k), wd = d.getDay();
    h += '<div class="tick' + (i===c?' on':'') + (i===0?' today':'') + (wd===0||wd===6?' we':'') + (holiday(k)?' hol':'') + '" data-i="' + i + '" style="transform:rotate(' + a.toFixed(2) + 'deg) translateY(-' + dial.R + 'px);opacity:' + Math.max(0, 1 - Math.abs(a)/42).toFixed(2) + '"><small>' + (d.getDate()===1 ? MONS[d.getMonth()] : WDS[wd]) + '</small><b>' + d.getDate() + '</b><span class="dots">' + dotsFor(k,3) + '</span></div>';
  }
  el.innerHTML = h;
  $('#btn-today').classList.toggle('show', Math.abs(dial.pos) > .5);
  if (view==='list') $('#hdr-title').innerHTML = hdrTitle(parseKey(dKey(c)));
}
function dialSet(p, user){
  dial.pos = p; const c = Math.round(p);
  if (c !== dial.last){ dial.last = c;
    if (user){ try { navigator.vibrate && navigator.vibrate(3); } catch(e){}
      selDay = dKey(c); showPast = false; if (view==='month') monthCursor = firstOfMonth(parseKey(selDay));
      dial.quiet = true; renderCore(); window.scrollTo({top:0}); setTimeout(()=>{ dial.quiet = false; }, 120); } }
  dialDraw();
}
function dialAnimate(to, user, ms){
  cancelAnimationFrame(dial.anim); const from = dial.pos, t0 = performance.now(), dur = ms || 320;
  const step = now => { const t = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1 - t, 3);
    dialSet(from + (to - from) * e, user); if (t < 1) dial.anim = requestAnimationFrame(step); };
  dial.anim = requestAnimationFrame(step);
}
function dialSync(){ if (dial.drag) return; const i = dIdx(selDay); if (Math.round(dial.pos) !== i){ dial.last = i; dialAnimate(i, false); } else dialDraw(); }
function dialInit(){
  const el = $('#dial'), ticks = $('#dial-ticks'), rail = $('#dial-rail');
  const top = dial.R + 52; ticks.style.top = top + 'px';
  const rr = dial.R + 34; Object.assign(rail.style, { width: 2*rr+'px', height: 2*rr+'px', marginLeft: -rr+'px', top: (top - rr)+'px' });
  const pxPerDay = dial.R * dial.STEP * Math.PI / 180;
  el.addEventListener('pointerdown', ev => {
    cancelAnimationFrame(dial.anim); el.setPointerCapture(ev.pointerId);
    dial.drag = { x: ev.clientX, p: dial.pos, moved: 0, hist: [[performance.now(), ev.clientX]] };
  });
  el.addEventListener('pointermove', ev => { const g = dial.drag; if (!g) return;
    const dx = ev.clientX - g.x; g.moved = Math.max(g.moved, Math.abs(dx));
    g.hist.push([performance.now(), ev.clientX]); if (g.hist.length > 6) g.hist.shift();
    dialSet(g.p - dx / pxPerDay, true);
  });
  const end = ev => { const g = dial.drag; if (!g) return; dial.drag = null;
    if (g.moved < 6){ const t = document.elementFromPoint(ev.clientX, ev.clientY); const tk = t && t.closest('.tick');
      if (tk) dialAnimate(+tk.dataset.i, true, 260); else dialAnimate(Math.round(dial.pos), true, 200); return; }
    const a = g.hist[0], b = g.hist[g.hist.length-1], dt = Math.max(1, b[0]-a[0]);
    let v = -(b[1]-a[1]) / dt / pxPerDay; let prev = performance.now();
    const coast = now => { const ms = now - prev; prev = now; v *= Math.pow(0.94, ms/16);
      if (Math.abs(v) < 0.0025){ dialAnimate(Math.round(dial.pos), true, 220); return; }
      dialSet(dial.pos + v * ms, true); dial.anim = requestAnimationFrame(coast); };
    dial.anim = requestAnimationFrame(coast);
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  $('#btn-today').onclick = () => { selDay = todayKey(); dialAnimate(0, true, 420); };
  let raf = 0;
  window.addEventListener('scroll', () => { if (view!=='list' || dial.drag || dial.quiet) return; cancelAnimationFrame(raf); raf = requestAnimationFrame(() => {
    const lim = $('.top').getBoundingClientRect().bottom + 8;
    const sec = [...document.querySelectorAll('#main .day[id^="d-"]')].find(s => s.getBoundingClientRect().bottom > lim + 30); if (!sec) return;
    const i = dIdx(sec.id.slice(2)); if (i !== Math.round(dial.pos)){ dial.last = i; dialAnimate(i, false, 220); }
  }); }, { passive: true });
  dial.last = dIdx(selDay); dial.pos = dial.last; dialDraw();
}

async function openIdeas(){
  openSheet(`<h3>Nápady na vylepšení</h3>
    <p class="hint" style="margin-top:-6px">Co vám chybí, co vadí, co by šlo líp? Napište to sem – Táta to uvidí.</p>
    <label class="field"><textarea class="inp" id="i-text" placeholder="Např. chtěl bych barvu podle typu události…" maxlength="2000" style="height:110px"></textarea></label>
    <div class="actions"><button class="btn ghost" id="i-back">Zpět</button><button class="btn" id="i-send">Odeslat</button></div>
    <div id="i-list" style="margin-top:18px"></div>`, async s => {
    s.querySelector('#i-back').onclick = openSettings;
    const list = async () => {
      const { data } = await sb.from('feedback').select('*').order('created_at', { ascending: false }).limit(50);
      const box = s.querySelector('#i-list'); if (!box) return;
      if (!data || !data.length){ box.innerHTML = ''; return; }
      const { data: cms } = await sb.from('feedback_comments').select('*').in('feedback_id', data.map(f => f.id)).order('created_at');
      const who = id => { const m = memberOf(id); return m ? `<b style="color:${m.color}">${esc(m.name)}</b>` : '<b>?</b>'; };
      box.innerHTML = `<div class="day-h"><h2 style="font-size:18px">Zatím napsané</h2><span>${data.length}</span></div>` + data.map(f => {
        const cs = (cms || []).filter(c => c.feedback_id === f.id);
        return `<div class="idea" data-id="${f.id}"><small>${who(f.member_id)} · ${esc(fmtDM.format(new Date(f.created_at)))}</small><span class="itx">${esc(f.text)}</span>${cs.length ? `<div class="cms">${cs.map(c => `<div class="cm">${who(c.member_id)} ${esc(c.text)}<small>${esc(fmtDM.format(new Date(c.created_at)))}</small></div>`).join('')}</div>` : ''}<div class="cm-new"><input class="inp cm-inp" placeholder="💬 Napsat komentář…" maxlength="2000"><button class="cm-send" aria-label="Odeslat komentář">➤</button></div></div>`;
      }).join('');
      box.querySelectorAll('.cm-send').forEach(b => b.onclick = async () => {
        const card = b.closest('.idea'), inp = card.querySelector('.cm-inp'), t = inp.value.trim(); if (!t) return;

        const { data: c, error } = await sb.from('feedback_comments').insert({ feedback_id: card.dataset.id, member_id: me.id, text: t }).select();

      s.querySelector('#i-text').value = ''; toast('Díky! Nápad je uložený a ostatní dostanou upozornění'); list();
    };
    list();
  });
}
